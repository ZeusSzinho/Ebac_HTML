<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>Formulário de Cadastro</h1>
    </header>
<main>
    <form>
        <label for="nome"> Nome:</label>
        <input id="nome"  type="text" placeholder="Nome completo"> <br>
        <label for="email">E-mail:</label>
        <input id="email" type="email" placeholder="Escreva seu email"><br>
        <label for="senha">Senha:</label>
        <input id="senha" type="password" placeholder="Senha"><br>

        <button type="submit">
            Cadastrar
        </button>

        <button type="reset">
            Limpar
        </button>
</form>
</main> 
</body>

</html>
